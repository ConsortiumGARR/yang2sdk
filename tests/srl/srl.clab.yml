name: yang2sdk-srl
# LAB ONLY — single SR Linux node for the yang2sdk NETCONF SDK.
# Pinned image: update the tag AND the digest together in PINNED.md, which
# also records the pinned containerlab version used by ci-srl.yaml.
# See README.md in this directory.
topology:
  nodes:
    srl1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:25.10.1
      type: ixr-d2l
      ports:
        - 127.0.0.1:1830:830
      startup-config: srl-startup.cli
