[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yang2sdk"
version = "2026.10.16.1"
description = "Generate a Pydantic-based IDE-friendly SDK from YANG modules."
readme = "README.md"
requires-python = ">=3.12"
# PEP 639 SPDX expression. The LICENSE/NOTICE files were already being packed
# (hatchling auto-detects them, hence `License-File:` in the built METADATA)
# but no license *expression* was declared, so PyPI had nothing to classify
# the project by.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Name only, no contact address: package metadata is public and permanent, so
# no email is declared here. SECURITY.md is where reports should go.
authors = [{ name = "Matteo Colantonio" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
dependencies = [
    "jinja2>=3.1.6",
    "pyang>=2.7.1",
    "pydantic>=2.12.5",
    "pydantic-xml>=2.21.0",
    "requests>=2.32.5",
]

[project.urls]
Repository = "https://github.com/ConsortiumGARR/yang2sdk"
Changelog = "https://github.com/ConsortiumGARR/yang2sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/ConsortiumGARR/yang2sdk/issues"

[project.optional-dependencies]
# Lab-only tooling (downloader/tester + live-simulator tests). Kept out of the
# default install so downstream consumers of the generator never pay for it.
# Lab work: `uv sync --locked --extra lab` or `pip install yang2sdk[lab]`.
lab = [
    "lxml>=4.9.0",
    "ncclient>=0.7.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
# One entry point, `--protocol netconf|restconf`. Replaces the
# yang2netconf/yang2restconf pair, which were the same program with a hardcoded
# transport. Everything except --protocol is forwarded to cli.compiler.
yang2sdk = "yang2sdk.cli.main:main"
# Lab-only (require `yang2sdk[lab]`); kept as scripts for the documented dev workflow.
yang-downloader = "yang2sdk.cli.downloader:main"
# Full-SDK validation against a lab device. Supersedes `tester`, which only read
# the top-level navigators of a RESTCONF client and never touched writes or RPCs.
sdk-verify = "yang2sdk.cli.sdk_verify:main"

[dependency-groups]
# The four blocking gates (ruff, ruff format, ty, pyrefly) are pinned EXACTLY
# and run from this venv via `uv run`, never `uvx`. Two reasons:
#
# 1. `uvx <tool>` resolves the newest release on every invocation, so a gate
#    could start failing with no commit and no diff to explain it. That is not
#    hypothetical: ty 0.0.60 passed, 0.0.86 flags a deprecated
#    `@contextmanager` overload in tests/test_srl_netconf.py.
# 2. `uv sync --locked` + exact pins makes CI hermetic — a tool release landing
#    upstream cannot change what CI installs. Bumping is then a deliberate,
#    visible act (see the bump procedure in docs/dev.md), never a background
#    event.
#
# Bump with: uv lock --upgrade-package ty, then re-run the gates (docs/dev.md)
dev = [
    "ruff==0.17.1",
    "ty==0.0.89",
    "pyrefly==1.4.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: fast subset (latest tag per notconf family)",
    "integration: requires docker + pulled notconf images (needs NOTCONF_RUN_INTEGRATION=1)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yang2sdk"]

[tool.ruff]
target-version = "py312"
exclude = ["temp", ".venv", ".ruff_cache"]

# ty respected .gitignore by default, so ephemeral temp/ output needed no
# section -- that stopped being the whole story once a module outside src/ was
# imported by something under test, hence the section below.

[tool.ty.environment]
# `src` and `.` are inferred from the project layout; `scripts` is not, because
# the release tooling is a sibling of `src/` rather than part of the package
# (it must not ship in the wheel). Without it, `import changelog` in
# scripts/release.py and tests/test_changelog.py is an unresolved import and the
# release gates are the one part of the repo that goes unchecked.
extra-paths = ["scripts"]

[tool.pyrefly]
# "src" resolves the shipped package; "." resolves `tests.*` so cross-module
# helpers (e.g. tests/srl/lab.py imported by tests/test_srl_netconf.py) are
# type-checked as real imports instead of needing a suppression. Without the
# second root pyrefly infers src/ alone and reports missing-import.
# "scripts" is the third root for the same reason: scripts/release.py imports
# scripts/changelog.py, and the release gates are the one part of this repo
# that runs unguarded by the offline suite unless they type-check.
search-path = ["src", ".", "scripts"]
# tests/srl/clab-*/ is containerlab runtime state (node config, broken
# symlinks into the container FS) — ephemeral, never committed.
project-excludes = ["temp/**", ".venv/**", "tests/srl/clab-*/**"]
