[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yang2sdk"
version = "0.1.0"
description = "Generate a Pydantic-based IDE-friendly SDK from YANG modules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pyang>=2.7.1",
    "pydantic>=2.12.5",
    "pydantic-xml>=2.21.0",
    "requests>=2.32.5",
]

[project.optional-dependencies]
# Lab-only tooling (downloader/tester + live-simulator tests). Kept out of the
# default install so downstream consumers of the generator never pay for it.
# Lab work: `uv sync --locked --extra lab` or `pip install yang2sdk[lab]`.
lab = [
    "lxml>=4.9.0",
    "ncclient>=0.7.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
yang2restconf = "yang2sdk.cli.compiler:restconf"
yang2netconf = "yang2sdk.cli.compiler:netconf"
# Lab-only (require `yang2sdk[lab]`); kept as scripts for the documented dev workflow.
yang-downloader = "yang2sdk.cli.downloader:main"
# Full-SDK validation against a lab device. Supersedes `tester`, which only read
# the top-level navigators of a RESTCONF client and never touched writes or RPCs.
sdk-verify = "yang2sdk.cli.sdk_verify:main"

[dependency-groups]
dev = [
    "gitingest>=0.3.1",
    "ruff>=0.1.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: fast subset (latest tag per notconf family)",
    "integration: requires docker + pulled notconf images (needs NOTCONF_RUN_INTEGRATION=1)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yang2sdk"]

[tool.ruff]
target-version = "py312"
exclude = ["temp", ".venv", ".ruff_cache"]

# ty needs no section: it respects .gitignore by default, so ephemeral
# temp/ output is excluded; Python version comes from .python-version/.venv.

[tool.pyrefly]
# "src" resolves the shipped package; "." resolves `tests.*` so cross-module
# helpers (e.g. tests/srl/lab.py imported by tests/test_srl_netconf.py) are
# type-checked as real imports instead of needing a suppression. Without the
# second root pyrefly infers src/ alone and reports missing-import.
search-path = ["src", "."]
# tests/srl/clab-*/ is containerlab runtime state (node config, broken
# symlinks into the container FS) — ephemeral, never committed.
project-excludes = ["temp/**", ".venv/**", "tests/srl/clab-*/**"]
