name: ci-srl
# SR Linux (Nokia) in containerlab — the repo's only real *commercial* NOS.
#
# Why this exists: every notconf image is a simulator built from a handful of
# IETF/vendor models, and the Groove G30 is a single lab device that is
# writable-running only. None of them exercise a full vendor model tree
# (hundreds of modules, deep augment closure, identityref leaves) through the
# generated client. SR Linux does, in a container, for free.
#
# NOT an NMDA device, contrary to an earlier revision of this file. Measured
# against SR Linux 25.10.1 from a raw <hello> (370 capabilities): its complete
# base-capability set is candidate, confirmed-commit, rollback-on-error,
# startup, url, validate, with-defaults, with-operational-defaults and
# yang-library. It ships the ietf-netconf-nmda *module* but does NOT advertise
# `:nmda:1.0` — precisely the false positive guarded in
# tests/test_matrix.py::test_nmda_is_detected_from_the_capability_uri_not_a_module_name.
# So this job must not be described as NMDA coverage.
#
# Cost: this repository is public, so standard GitHub-hosted runners are free.
# Do NOT move this job to a `*-large` runner — larger runners are billed even
# for public repositories.
#
# Severity is deliberately split:
#   deploy / readiness / get-schema / generate -> BLOCKING. Zero coverage must
#     never render as a green run, and each of these failing means the steps
#     after it prove nothing.
#   pytest / sdk-verify                         -> non-blocking
#     (continue-on-error). Device boot timing and init races are real; a
#     failure here is a signal to read, not a merge blocker.
# Every blocking step must also pass for pytest to run at all (the default
# `if: success()`), so a broken lab is never reported as "tests passed".
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-srl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  srl-containerlab:
    # Standard runner, not a larger one: 4 vCPU / 16 GB RAM is above SR Linux's
    # documented 2 vCPU / 4 GB minimum, and it keeps the job free for a public repo.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Deliberately no `needs:`. GitHub Actions cannot express dependencies
    # across workflow files, so this cannot wait on ci-pr.yaml's lint-typecheck
    # job — it runs in parallel with ci-pr instead, and does its own `uv sync`.
    # Since the pytest step is non-blocking, ordering against the real gates
    # would buy nothing anyway.

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install containerlab (pinned)
        # CLAB_VERSION is pinned for the same reason tests/srl/srl.clab.yml pins
        # the SR Linux image: an unpinned containerlab release can change deploy
        # or readiness behaviour overnight and turn a green pipeline red with no
        # code change. Bump it deliberately, and note the bump in the PR.
        # `install-containerlab` only — the runner already ships docker and has
        # passwordless sudo, and "all" would try to install its own docker.
        env:
          CLAB_VERSION: "0.79.0"
        run: |
          curl -sL https://containerlab.dev/setup | sudo -E bash -s install-containerlab
          containerlab version

      - name: Install project
        run: uv sync --locked --group dev --extra lab

      - name: Deploy SR Linux lab
        # `sudo -E` keeps $HOME so containerlab writes its lab state next to
        # the topology file (tests/srl/clab-*/, already gitignored) instead of
        # under /root. containerlab needs root for the privileged SR Linux node.
        #
        # Most likely failure mode on a new runner: SR Linux's DPDK-based XDP
        # datapath needs the SSSE3 instruction set and containerlab *aborts*
        # deploy without it. GitHub's AMD EPYC runners have SSSE3, but keep the
        # full deploy output in the log so that diagnosis is one scroll away.
        run: |
          sudo -E containerlab deploy -t tests/srl/srl.clab.yml

      - name: Wait for NETCONF readiness
        # The lab is not usable the instant `deploy` returns: SR Linux takes
        # minutes to bring up its management plane. tests/srl/lab.py polls the
        # RFC 6241 Sec 8 hello with the lab's own credentials and exits
        # non-zero on timeout, so a node that never boots fails here loudly
        # rather than skipping every test below.
        run: uv run python -m tests.srl.lab

      - name: Download YANG from the node (get-schema)
        # Same path the notconf suite uses: the shipped yang-downloader, so the
        # integration suite exercises the code users actually run. It also
        # writes features.json from the <hello> capability set, which
        # the compiler picks it up automatically as --features-file.
        #
        # Single source of truth for host/port/credentials: the committed
        # tests/srl/.env.srl.example (published containerlab defaults, not
        # secrets). It must be sourced *here* — every `run:` is a fresh shell,
        # so exporting it in an earlier step would not survive. downloader.main()
        # reads DEVICE_IP / NETCONF_PORT / DEVICE_USER / DEVICE_PASS /
        # DEVICE_NAME from the environment and exits 2 if any is missing.
        # DEVICE_NAME is what makes the output land in temp/yang_modules/srl.
        #
        # NOTE: downloader.main() discards download_all()'s failure count and
        # still exits 0, so a partial extraction looks like success. Guard on
        # the artefacts instead of trusting the exit code.
        run: |
          set -a
          # shellcheck disable=SC1091
          source tests/srl/.env.srl.example
          set +a
          echo "lab endpoint ${DEVICE_IP}:${NETCONF_PORT} as device '${DEVICE_NAME}'"
          uv run yang-downloader
          count=$(find temp/yang_modules/srl -name '*.yang' | wc -l)
          echo "downloaded ${count} YANG modules"
          if [ "$count" -lt 10 ]; then
            echo "::error::get-schema returned only ${count} modules — refusing to compile"
            exit 1
          fi
          test -f temp/yang_modules/srl/features.json \
            || { echo "::error::features.json missing — <hello> capability parse failed"; exit 1; }

      - name: Generate the NETCONF client from the node's own models
        # Roots are the two the tests navigate to: <system> (system/name/host-name,
        # management, logging) and the interfaces list.
        #
        # yang2sdk resolves the augment closure itself (88c2681), so the
        # explicit closure.py step that used to live here is redundant —
        # naming the two roots is enough. Kept as a single command so this job
        # exercises the documented user path rather than a special one.
        #
        # --roots, not positional paths: that is the form a script or CI job
        # should use, and it is what proves `yang2sdk` resolves module names to
        # files. A TTY-less run must never prompt, which
        # test_yang2sdk_refuses_to_prompt_when_stdin_is_not_a_tty pins.
        run: |
          uv run yang2sdk --protocol netconf \
            --roots srl_nokia-system,srl_nokia-interfaces \
            --device srl \
            --device-version 25.10.1 \
            --yang-dir temp/yang_modules/srl \
            --output-dir temp/netconf_clients/srl
          # One copy, in the installable project the generated README names
          # (tests/srl/PINNED.md pins the image tag this version comes from).
          test -f temp/netconf_clients/srl/srl_25_10_1/pyproject.toml
          test -f temp/netconf_clients/srl/srl_25_10_1/src/srl_25_10_1/__init__.py

      - name: SR Linux NETCONF suite
        # NON-BLOCKING on purpose. Everything above must pass for this step to
        # even run (default `if: success()`), so a broken lab is still a red X.
        # A failure *here* is a device/timing or generator-regression signal that
        # should be read, not a merge blocker.
        #
        # Expect one skip: test_hostname_mutate_restore. A whole-<system> merge
        # is not expressible against this device for two verified reasons —
        # SR Linux rejects identityref writes in the RFC 7951 string form it
        # itself emits, and a write below the root omits the ancestor path the
        # device requires. Both are documented at tests/test_srl_netconf.py.
        # This job's first run earned that skip: it is not a pre-existing
        # condition.
        id: srl-tests
        continue-on-error: true
        env:
          NOTCONF_RUN_INTEGRATION: "1"
        run: uv run pytest tests/test_srl_netconf.py -v

      - name: sdk-verify against the full vendor tree
        # NON-BLOCKING, same severity as the pytest step above. This is the
        # exhaustive walk — every reachable node at bounded depth, every RPC
        # Input serialised — over a tree the notconf simulators cannot match
        # (397 modules, deep augment closure, identityref leaves).
        #
        # `crud` is enabled here and only here. It is a writer: it holds the
        # candidate lock, merges, reads back, discards, and proves restoration
        # with a whole-tree digest, and it refuses to run without BOTH
        # --write and a second acknowledgement (--allow-running-writes here,
        # since SR Linux has :candidate). That is why it does not belong in the
        # notconf smoke matrix.
        #
        # Measured locally against 25.10.1: 291 pass / 0 fail / 170 skip, with
        # `verify-restore: config digest matches snapshot`.
        id: srl-sdk-verify
        continue-on-error: true
        run: |
          set -a
          # shellcheck disable=SC1091
          source tests/srl/.env.srl.example
          set +a
          uv run sdk-verify \
            --device srl \
            --protocol netconf \
            --tiers read,rpc,crud \
            --write \
            --allow-running-writes \
            --no-verify-tls \
            --snapshot temp/verify/srl-netconf-crud-snapshot.json \
            --json-out temp/verify/srl-netconf-report.json

      - name: Container logs
        # `failure()` alone would MISS the case that matters most: a failing
        # pytest step does not put the job in a failed state, because it is
        # continue-on-error. Check those steps' own outcomes too, or a
        # generator regression would be reported with no device logs to
        # explain it. Runs before destroy, while the containers still exist.
        if: >-
          failure() ||
          steps.srl-tests.outcome == 'failure' ||
          steps.srl-sdk-verify.outcome == 'failure'
        run: |
          docker ps -a --format '{{.Names}}' | grep -e clab- || true
          for c in $(docker ps -a --format '{{.Names}}' | grep -e clab- || true); do
            echo "===== ${c} ====="
            docker logs --tail 200 "$c" || true
          done

      - name: Destroy the lab
        # Always: an abandoned privileged container keeps its port binding and
        # its ~2 GB of disk until the runner is reclaimed.
        if: always()
        run: |
          sudo -E containerlab destroy -t tests/srl/srl.clab.yml --cleanup || true