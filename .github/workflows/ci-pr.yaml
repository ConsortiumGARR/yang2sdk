name: ci-pr
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --group dev --extra lab
      # `uv run`, not `uvx`: the four gates are pinned exactly in the dev group
      # so CI installs what uv.lock says. `uvx` would resolve the newest release
      # on every run and could redden main with no commit to explain it.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pyrefly check

  offline-tests:
    needs: lint-typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --group dev --extra lab
      # The whole offline suite, not one file. It ran `pytest tests/test_matrix.py`
      # alone, so every test added outside it was never executed by CI — 46 of
      # them at the time this was found, covering the release gates. `testpaths`
      # is `tests/` and `conftest.py` skips anything marked `integration` unless
      # `--integration` is passed, so this needs no marker filter and no
      # container: measured locally at 52s, 206 passed and 185 skipped.
      - run: uv run pytest -v

  smoke:
    needs: lint-typecheck
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - { package: notconf, tag: latest }
          - { package: notconf-ietf, tag: latest }
          - { package: notconf-sros, tag: "22.2" }
          - { package: notconf-junos, tag: 23.4R1 }
          - { package: notconf-cisco-xr, tag: "2411" }
          - { package: notconf-cisco-nx, tag: 10.4-4 }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --group dev --extra lab
      # test_sdk_verify_ci.py drives `sdk-verify` (every reachable node + every RPC
      # Input serialised) against the same container the other two reuse, so it
      # adds no container startup. It was a manual lab harness in no workflow,
      # which is how three shipped defects survived: the RESTCONF
      # ancestor-envelope unwrap, the NETCONF augment-closure gap, and the
      # ietf-notification-capabilities model hole. Blocking, per image.
      - run: >-
          uv run pytest tests/test_notconf_protocol.py tests/test_sdk_generate.py
          tests/test_sdk_verify_ci.py -v
        env:
          NOTCONF_RUN_INTEGRATION: "1"
          NOTCONF_IMAGE_PACKAGE: ${{ matrix.image.package }}
          NOTCONF_IMAGE_TAG: ${{ matrix.image.tag }}

  # ci-gate: the single required check on main. It `needs` every other job in
  # this workflow, so the branch ruleset only has to require this one stable
  # name instead of one context per job/matrix shard. When you add a job to
  # this workflow, add it to ci-gate's `needs` in the same PR (forgetting it
  # fails open: the new job simply isn't gated).
  ci-gate:
    needs: [lint-typecheck, offline-tests, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every ci-pr job succeeded
        run: |
          needs='${{ toJSON(needs) }}'
          echo "$needs" | jq -c 'with_entries(.value = .value.result)'
          if ! echo "$needs" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "::error::ci-gate: one or more ci-pr jobs did not succeed"
            exit 1
          fi
          echo "all ci-pr jobs succeeded"
