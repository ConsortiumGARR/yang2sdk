# STRESS-TEST PROBE (minimal) — temporary, safe to delete.
# Isolation test: does a brand-new workflow introduced via PR run at all?
# No permissions block, no API calls, just proves execution.
name: ruleset-write-probe

on:
  pull_request:

jobs:
  alive:
    runs-on: ubuntu-latest
    steps:
      - name: Prove execution
        run: echo "PROBE ALIVE — event=${{ github.event_name }} repo=${{ github.repository }} token-scope-test=next"
      - name: Can this GITHUB_TOKEN read the ruleset?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ConsortiumGARR/yang2sdk/rulesets/25119636")
          echo "GET ruleset with default token -> HTTP $code"
